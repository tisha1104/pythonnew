<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1 align="center">Student Details</h1>
    <hr>
    <table align="center" border="1" cellspacing="10" cellpading="10">
        <tr>
            <th>id</th>
            <th>name</th>
            <th>age</th>
            <th>email</th>
            <th colspan="2">Action</th>
            
        </tr>
        {%for st in student%}
        <tr>
            <td>{{st.id}}</td>
            <td>{{st.name}}</td>
            <td>{{st.age}}</td>
            <td>{{st.email}}</td>
            <td><a href="{%url 'delete'%}?id={{st.id}}">Delete</a></td>
            <td><a href="{%url 'edit'%}?id={{st.id}}">Edit</a></td>
        </tr>
        {%endfor%}
    </table>
    <!-- {{student}} -->
    <br>
    <h4 align="center"><a href="{%url 'home'%}">Back to Register</a></h4>
</body>
</html>
