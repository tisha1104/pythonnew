<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>
    <div class="comtener">
        <div class="row">
            <div class="col-5  mx-auto mt-3 p-5 card bg-light"></div>
            <h2>USER RAGISTRAION</h2>
            <span class="text-success">{{title}}</span>
            <span class="text-danger">{{error}}</span>
            <form action="" method="post">
                {%csrf_token%}
                <input type="text" name="fname" placeholder="enter your name" class="form-control">
                <br>
                <input type="text" name="lname" placeholder="enter your lname" class="form-control">
                <br>
                <input type="text" name="username" placeholder="enter your username" class="form-control">
                <br>
                <input type="password" name="password" placeholder="enter your password" class="form-control">
                <br>
                <input type="submit" class="btn">
                <input type="reset" class="btn">
                <a href="{%url 'login'%}" class="btn btn-warning">Login here</a>
            </form>
        </div>
    </div>
</body>
</html>
