<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <style>
    .search-form {
        display: flex;
        gap: 10px;
        margin: 20px 0;
        align-items: center;
        flex-wrap: wrap;
    }

    .search-form input {
        padding: 10px;
        border: 1px solid #ccc;
        border-radius: 8px;
        outline: none;
        font-size: 14px;
    }

    .search-form input[type="text"] {
        width: 250px;
    }

    .search-form input[type="number"] {
        width: 130px;
    }

    .search-form button {
        padding: 10px 18px;
        border: none;
        background: #007bff;
        color: white;
        border-radius: 8px;
        cursor: pointer;
    }

    .search-form button:hover {
        background: #0056b3;
    }

    .reset-btn {
        text-decoration: none;
        padding: 10px 18px;
        background: #dc3545;
        color: white;
        border-radius: 8px;
    }

    .reset-btn:hover {
        background: #b02a37;
    }
</style>
</head>
<body>
    <div class="contener">
        <div class="row ">
            <div class="col-5">
                <h1>PRODUCT REGISTRATION</h1>
                <hr>
                <form action="" method="post" enctype="multipart/form-data">
                    {%csrf_token%}
                    <span>{{msg}}</span>
                    <br>
                    <input type="hidden" name="id" value="{{p.id}}">
                    <input type="text" name="name" placeholder="enter product name" class="form-control" value="{{p.name}}">
                    <br>
                    <input type="text" name="price" placeholder="enter product price" class="form-control" value="{{p.price}}">
                    <br>
                    <input type="text" name="qty" placeholder="enter product qty" class="form-control" value="{{p.qty}}">
                    <br>
                    {%if p%}
                    <img src="media/{{p.image}}" alt="" height="50px" width="50px">
                    <span>{{p.image}}</span>
                    {%endif%}
                    <br>
                    <input type="file" name="image">
                    <br>
                    <br>
                    <input type="submit" class="btn btn-success">
                    <input type="reset" class="btn btn-primary">
                </form>
            </div>
        </div>
        <div class="col-1">

        </div>
        <div class="col-5">
            <h1>PRODUCT DETAILS</h1>
            <form method="GET" class="search-form">
    <input type="text" name="q" placeholder="Search product..." value="{{ request.GET.q }}">

    <input type="number" name="min_price" placeholder="Min Price" value="{{ request.GET.min_price }}">

    <input type="number" name="max_price" placeholder="Max Price" value="{{ request.GET.max_price }}">

    <button type="submit">Search</button>
    <a href="{% url 'home' %}" class="reset-btn">Reset</a>
</form>
</form>
            <hr>
            <table class="table" border="1" colspacing="10" colpading="10">
                <tr>
                    <th>ID</th>
                    <th>NAME</th>
                    <th>PRICE</th>
                    <th>QTY</th>
                    <th>IMAGE</th>
                    <th colspan="2">ACTION</th>
                </tr>
                {%for p in products%}
                <tr>
                    <td>{{forloop.counter}}</td>
                    <td>{{p.name}}</td>
                    <td>{{p.price}}</td>
                    <td>{{p.qty}}</td>
                    <td><img src="media/{{p.image}}" alt="{{p.image}}" height="50px" width="50px">image</td>
                    <td><a href="{%url 'edit'%}?id={{p.id}}" class="btn btn-primary">edit</a></td>
                    <td><a href="{%url 'delete'%}?id={{p.id}}" class="btn btn-danger">delete</a></td>
                </tr>
                {%endfor%}
            </table>
           <h1 algin="center"> <a href="{%url 'logout'%}">logout</a></h1>
        </div>
    </div>
</body>
</html>
