<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>
    <div class="contener">
        <div class="row ">
            <div class="col-5">
                <h1>PRODUCT REGISTRATION</h1>
                <hr>
                <form action="" method="post" enctype="multipart/form-data">
                    {%csrf_token%}
                    <span>{{msg}}</span>
                    <br>
                    <input type="hidden" name="id" value="{{p.id}}">
                    <input type="text" name="name" placeholder="enter product name" class="form-control" value="{{p.name}}">
                    <br>
                    <input type="text" name="price" placeholder="enter product price" class="form-control" value="{{p.price}}">
                    <br>
                    <input type="text" name="qty" placeholder="enter product qty" class="form-control" value="{{p.qty}}">
                    <br>
                    {%if p%}
                    <img src="media/{{p.image}}" alt="" height="50px" width="50px">
                    <span>{{p.image}}</span>
                    {%endif%}
                    <br>
                    <input type="file" name="image">
                    <br>
                    <br>
                    <input type="submit" class="btn btn-success">
                    <input type="reset" class="btn btn-primary">
                </form>
            </div>
        </div>
        <div class="col-1">

        </div>
        <div class="col-5">
            <h1>PRODUCT DETAILS</h1>
            <hr>
            <table class="table" border="1" colspacing="10" colpading="10">
                <tr>
                    <th>ID</th>
                    <th>NAME</th>
                    <th>PRICE</th>
                    <th>QTY</th>
                    <th>IMAGE</th>
                    <th colspan="2">ACTION</th>
                </tr>
                {%for p in products%}
                <tr>
                    <td>{{forloop.counter}}</td>
                    <td>{{p.name}}</td>
                    <td>{{p.price}}</td>
                    <td>{{p.qty}}</td>
                    <td><img src="media/{{p.image}}" alt="{{p.image}}" height="50px" width="50px">image</td>
                    <td><a href="{%url 'edit'%}?id={{p.id}}" class="btn btn-primary">edit</a></td>
                    <td><a href="{%url 'delete'%}?id={{p.id}}" class="btn btn-danger">delete</a></td>
                </tr>
                {%endfor%}
            </table>
           <h1 algin="center"> <a href="{%url 'logout'%}">logout</a></h1>
        </div>
    </div>
</body>
</html>
