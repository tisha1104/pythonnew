<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login & Registration</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

    <div class="container">
        <div class="row mt-5">

            <!-- Registration Form -->
            <div class="col-lg-5 col-md-6 col-sm-12 mx-auto card p-4 shadow">
                <h3 class="text-center mb-3">User Registration</h3>

                {% if msg %}
                    <div class="alert alert-success">{{msg}}</div>
                {% endif %}
              
                    <div class="alert alert-success">{{title}}</div>
                
                <form action="{% url 'user-regierstation' %}" method="post">
                    {% csrf_token %}

                    <input type="text" name="fname" placeholder="First Name" class="form-control mb-2" required>
                    <input type="text" name="lname" placeholder="Last Name" class="form-control mb-2" required>
                    <input type="text" name="username" placeholder="Username" class="form-control mb-2" required>
                    <input type="password" name="password" placeholder="Password" class="form-control mb-3" required>

                    <button class="btn btn-success w-100">Register</button>
                </form>
            </div>

            <!-- Login Form -->
            <div class="col-lg-5 col-md-6 col-sm-12 mx-auto card p-4 shadow mt-4 mt-md-0">
                <h3 class="text-center mb-3">User Login</h3>
                <span>{{err}}</span>
                <form action="{% url 'login_register' %}" method="post">
                    {% csrf_token %}

                    <input type="text" name="username" placeholder="Username" class="form-control mb-2" required>
                    <input type="password" name="password" placeholder="Password" class="form-control mb-3" required>

                    <button class="btn btn-primary w-100">Login</button>

                    <a href="{% url 'forgotpass' %}" class="btn btn-link w-100">Forgotten Password?</a>
                </form>

            </div>

        </div>
    </div>

</body>
</html>
