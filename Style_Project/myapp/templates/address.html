{% extends 'base.html' %}

{% block body %}
{% load static %}


    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-4.0.0.js" integrity="sha256-9fsHeVnKBvqh3FB2HYu7g2xseAZ5MlN6Kz/qnkASV8U=" crossorigin="anonymous"></script>


<body class="bg-light">

<div class="container mt-5 mb-5">
    <div class="row justify-content-center">
        <div class="col-md-7">

            <!-- Add Address Card -->
            <div class="card shadow mb-4">
                <div class="card-header bg-dark text-white text-center">
                    <h4>Add New Address</h4>
                </div>

                <div class="card-body">
                    <form method="post">
                        {% csrf_token %}

                        <div class="mb-3">
                            <label class="form-label">Address</label>
                            <textarea id="adr"
                                name="address"
                                class="form-control"
                                rows="4"
                                placeholder="Enter your full delivery address here..."
                                required></textarea>
                        </div>

                        <div class="d-grid">
                            <button type="submit" class="btn btn-primary"onclick="addaddress()">
                                Save Address
                            </button>
                        </div>
                    </form>
                </div>
            </div>

            <!-- Saved Addresses -->
            <div class="card shadow">
                <div class="card-header bg-secondary text-white">
                    <h5 class="mb-0">Your Saved Addresses</h5>
                </div>

                <div class="card-body" id="alladr">

                    <!-- {% if addresses %}
                        {% for address in addresses %}
                            <div class="border rounded p-3 mb-3">
                                <p class="mb-1">{{ address }}</p>
                                <small class="text-muted">Saved Address</small>
                            </div>
                        {% endfor %}
                    {% else %} -->
                        <!-- <p class="text-muted text-center mb-0">
                            No address added yet.
                        </p>
                    {% endif %} -->

                </div>
            </div>

        </div>
    </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
<script>

$(document).ready(function(){
    get_address()
})

function addaddress(){
    var address=$('#adr').val()
    $.get('add_address',{address},function(rt){
        
    })
}

function get_address(){
    $.get('get_address',{},function(rt){

        var adr=""
        rt.adr.map(ele=>{
            adr+=` <div class="border rounded p-3 mb-3">
                                <p class="mb-1">${ele.address}</p>
                                
                            </div>`
        })
        $("#alladr").html(adr)
    })
}
</script>
{% endblock %}
