<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STUDENT DETAILS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>
    <table border="1" align="center" cellspacing="10" cellpadding="10">
        <h1 align="center">STUDENT DETAILS</h1>
        <hr>
        <tr>
            <th>ID</th>
            <th>NAME</th>
            <th>Email</th>
            <th>Age</th>
            <th>image</th>
            <th colspan="2">Action</th>
        </tr>
        {%for st in students%}
        <tr>
            <td>{{forloop.counter}}</td>
            <td>{{st.name}}</td>
            <td>{{st.email}}</td>
            <td>{{st.age}}</td>
            <td><img src="media/{{st.image}}" alt="{{st.image}}" height="50px" width="50px"></td>
            <td><a href="{%url 'edit'%}?id={{st.id}}" class="btn btn-primary">edit</a></td>
            <td><a href="{%url 'delete'%}?id={{st.id}}" class="btn btn-danger">delete</a></td>
        </tr>
        {%endfor%}
    </table>
    <br>
    <br>
    <h1 align="center"><a href="{%url 'home'%}">Back To Register Page</a></h1>
</body>
</html>
