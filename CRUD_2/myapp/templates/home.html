<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>
    <div class="contanier">
        <div class="row card mt-3">
            <div class="col-5 card p-3">
                <form action="" method="post" enctype="multipart/form-data">
                    <h2>PRODUCT RAGISTER</h2>
                    <span>{{msg}}</span>
                    {%csrf_token%}
                    <input type="hidden" name="id" value="{{p.id}}">
                    <input type="text" name="name" placeholder="Enter Your Name" class="form-control" value="{{p.name}}">
                    <br>
                    <br>
                    <input type="text" name="price" placeholder="Enter Your Price" class="form-control" value="{{p.price}}">
                    <br>
                    <br>
                    <input type="text" name="qty" placeholder="Enter Qty" class="form-control" value="{{p.qty}}">
                    <br>
                    <br>
                    {%if p%}
                    <img src="media/{{p.image}}" alt="" height="50px" width="50px">
                    <span>{{p.image}}</span>
                    {%endif%}
                    <input type="file" name="image" class="form-control">
                    <br>
                    <br>
                    <input type="submit" class="btn btn-primary">
                    <input type="reset" class="btn btn-success">
                </form>
            </div>
            <div class="col-1">

            </div>
            <div class="col-6 card p-3">
                <h2>PRODUCT DETAILS</h2>
                <table>
                 <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Price</th>
                    <th>Qty</th>
                    <th>Image</th>
                    <th>Action</th>
                 </tr>    
                 {%for p in product%}                
                    <tr>
                        <td>{{forloop.counter}}</td>
                        <td>{{p.name}}</td>
                        <td>{{p.price}}</td>
                        <td>{{p.qty}}</td>
                        <td><img src="media/{{p.image}}" alt="{{p.image}}" height="50px" width="5opx"></td>
                        <td><a href="{%url 'edit'%}?id={{p.id}}">EDIT</a></td>
                        <td><a href="{%url 'delete'%}?id={{p.id}}">DELETE</a></td>
                    </tr>
                    {%endfor%}
                </table>
            </div>
        </div>
    </div>
</body>
</html>
