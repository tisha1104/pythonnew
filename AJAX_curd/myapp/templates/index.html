<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <style>
        /* 🌸 Baby Pink Gradient Background */
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #fbd3e9, #fce4ec);
        }

        /* Card header gradient */
        .pink-gradient-header {
            background: linear-gradient(135deg, #f8bbd0, #f48fb1);
            color: white;
        }

        /* Table header gradient */
        .pink-gradient-table {
            background: linear-gradient(135deg, #fde2ea, #f8c8dc);
        }
    </style>

    <script>
        $(document).ready(function () {
                viewstudent()
        });


        function addstudent(){
            
                var name = $("#name").val()
                var email = $("#email").val()
                var phone = $("#phone").val()
                var csrfmiddlewaretoken=$('input[name="csrfmiddlewaretoken"]').val()

                

                $.post('register',{csrfmiddlewaretoken,name,email,phone},function(rt){
                    alert(rt)

                    $("#name").val("")
                    $("#email").val("")
                    $("#phone").val("")

                    viewstudent()
                })
        }

        function viewstudent(){
                $.get("display",{},function(rt){
                    var rows = ""
                    rt.studentes.map(ele =>{
                       rows+=`<tr><td>${ele.id}</td><td>${ele.name}</td><td>${ele.email}</td><td>${ele.phone}</td></tr>`
                    })
                    $("#tdata").html(rows)
                })
        }

    </script>
</head>

<body>

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-8">

            <!-- Registration Card -->
            <div class="card shadow-lg border-0">
                <div class="card-header pink-gradient-header text-center">
                    <h3>Student Registration</h3>
                </div>

                <div class="card-body bg-white rounded-bottom">
                    {%csrf_token%}
                    <form id="studentForm">
                        <div class="mb-3">
                            <label class="form-label">Name</label>
                            <input type="text" id="name" class="form-control" placeholder="Enter your name">
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Email</label>
                            <input type="email" id="email" class="form-control" placeholder="Enter your email">
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Phone</label>
                            <input type="text" id="phone" class="form-control" placeholder="Enter phone number">
                        </div>

                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-success" onclick="addstudent()">Submit</button>
                            <button type="reset" class="btn btn-secondary">Reset</button>
                        </div>

                    </form>
                </div>
            </div>

            <!-- Table Card -->
            <div class="card mt-4 shadow border-0">
                <div class="card-header bg-dark text-white">
                    Registered Students
                </div>

                <div class="card-body table-responsive bg-white">
                    <table class="table table-bordered table-hover text-center">
                        <thead class="pink-gradient-table">
                            <tr>
                                <th>ID</th>
                                <th>Name</th>
                                <th>Email</th>
                                <th>Phone</th>
                            </tr>
                        </thead>
                        <tbody id="tdata">
                            <!-- Data will be added here -->
                        </tbody>
                    </table>
                </div>
            </div>

        </div>
    </div>
</div>

</body>
</html>
