{% extends 'base.html' %}

{% block content %}

<div class="row justify-content-center">
    <div class="col-md-6">

        <div class="card shadow p-4">
            <h3 class="text-center mb-4">Edit Course</h3>

            <form method="POST">
                {% csrf_token %}

                <div class="mb-3">
                    <label>Title</label>
                    {{ form.title }}
                </div>

                <div class="mb-3">
                    <label>Description</label>
                    {{ form.description }}
                </div>

                <div class="mb-3">
                    <label>Price</label>
                    {{ form.price }}
                </div>

                <button class="btn btn-primary w-100">Update</button>
            </form>

        </div>

    </div>
</div>

{% endblock %}
