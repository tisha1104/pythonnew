{% extends "base.html" %}
{% load static %}

{% block body %}

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

<div class="container mt-5 mb-5">
    <div class="row justify-content-center">
        <div class="col-md-7">

            <!-- Add Address Card -->
            <div class="card shadow mb-4">
                <div class="card-header bg-dark text-white text-center">
                    <h4>Add New Address</h4>
                </div>

                <div class="card-body">
                    <form id="addressForm">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label class="form-label">Address</label>
                            <textarea id="adr"
                                name="address"
                                class="form-control"
                                rows="4"
                                placeholder="Enter your full delivery address here..."
                                required></textarea>
                        </div>

                        <div class="d-grid">
                            <button type="submit" class="btn btn-primary">Save Address</button>
                        </div>
                    </form>
                </div>
            </div>

            <!-- Saved Addresses -->
            <div class="card shadow">
                <div class="card-header bg-secondary text-white">
                    <h5 class="mb-0">Your Saved Addresses</h5>
                </div>

                <div class="card-body" id="alladr">
                    <!-- Addresses will load here via AJAX -->
                </div>
            </div>

        </div>
    </div>
</div>

<script>
$(document).ready(function(){
    get_address();
});

// Add new address
$('#addressForm').submit(function(e){
    e.preventDefault();
    var address = $('#adr').val().trim();
    if(address === "") return;

    $.get('add_address', {address: address}, function(rt){
        $('#adr').val(''); 
        get_address();
    });
});

// Fetch and render addresses
function get_address(){
    $.get('get_address', {}, function(rt){
        var adr = "";
        rt.adr.map(ele => {
            adr += `
            <div class="border rounded p-3 mb-3 d-flex justify-content-between align-items-center flex-wrap gap-2" id="adr-box-${ele.id}">
                <div class="d-flex align-items-center w-75 gap-2">
                    <input type="radio" name="selectedAddress" value="${ele.id}" class="form-check-input">

                    <input type="text" 
                           id="adr_${ele.id}" 
                           class="form-control border-0 bg-light" 
                           value="${ele.address}" 
                           readonly>
                </div>

                <div class="d-flex gap-2">
                    <button class="btn btn-sm btn-warning" onclick="editAddress(${ele.id}, this)">
                        Update
                    </button>
                    <button class="btn btn-sm btn-danger" onclick="delete_address(${ele.id})">
                        Delete
                    </button>
                </div>
            </div>`;
        });

        $("#alladr").html(adr);
    });
}

// Edit/update address
function editAddress(aid, btn){
    let input = $("#adr_" + aid);

    if(input.prop("readonly")){
        input.prop("readonly", false).focus();
        $(btn).text("Save");
    } else {
        $.get("{% url 'update_address' %}", {id: aid, address: input.val()}, function(rt){
            alert(rt);
            input.prop("readonly", true);
            $(btn).text("Update");
            get_address();
        });
    }
}

// Delete address 
function delete_address(id){
    $.get("{% url 'delete_address' %}", {id:id}, function(rt){
        alert(rt);
        get_address();
    });
}
</script>

{% endblock %}
