<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>registration</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

</head>
<body>
    <div class="container">
        <div class="row" card p-3>
            <div class="col-5 mt-3 mx-auto p-5 card bg-light">
                 <h2>Registration Here</h2>
                <form action="" method="post">
                    <span>{{msg}}</span>
                    {%csrf_token%}
                    <input type="text" name="fname" placeholder="Enter Your First_Name" class="form-controal">
                    <br>
                    <br>
                    <input type="text" name="lname" placeholder="Enter Your Last_Name" class="form-controal">
                    <br>
                    <br>
                    <input type="text" name="username" placeholder="Enter Your Username" class="form-controal">
                    <br>
                    <br>
                    <input type="password" name="password" placeholder="Enter Your Password" class="form-controal">
                    <br>
                    <br>
                    <input type="submit" class="btn btn-success">
                    <input type="reset" class="btn btn-primary">
                    <a href="{%url 'login'%}" class="btn btn-warning">Login Here</a>

                </form>
            </div>
        </div>
    </div>
</body>
</html>
