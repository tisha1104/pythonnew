<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>
    <div class="contener">
        <div class="row">
            <div class="col-5">
                <form action="" method="post" enctype="multipart/form-data">
                    {% csrf_token %}
                    <h1 align="center">STUDENT REGISTER HERE</h1>
                    <hr>
                    <span>{{msg}}</span>
                    <input type="hidden" name="id" value="{{st.id}}">
                    <br>
                    <input type="text" name="name" placeholder="Enter Your Name" class="form-control" value="{{st.name}}">
                    <br>
                    <br>
                    <input type="text" name="email" placeholder="Enter Your Email" class="form-control" value="{{st.email}}">
                    <br>
                    <br>
                    <input type="text" name="age" placeholder="Enter Your Age" class="form-control" value="{{st.age}}">
                    <br>
                    <br>
                    {%if st %}
                    <img src="media/{{st.image}}" alt="" width="50px" height="50px">
                    <span>{{st.image}}</span>
                    {%endif%}
                    <input type="file" name="image" class="form-control">
                    <br>
                    <br>
                    <input type="submit" class="btn  btn-success">
                    <input type="reset" class="btn btn-primary">
                </form>
            </div>
       
        
        <div class="col-1">

        </div>

        <div class="col-5">
            <h1>STUDENT DETAILS</h1>
            <hr>
            <table class="table" border="1" cellspacing="10" cellpading="10">
            <tr>
                <th>id</th>
                <th>name</th>
                <th>email</th>
                <th>age</th>
                <th>image</th>
                <th colspan="2">Action</th>
            </tr>
            {% for st in students%}
            <tr>
                <td>{{forloop.counter}}</td>
                <td>{{st.name}}</td>
                <td>{{st.email}}</td>
                <td>{{st.age}}</td>
                <td><img src="media/{{st.image}}" alt="{{st.image}}" height="50px" width="50px"></td>
                <td><a href="{%url 'edit'%}?id={{st.id}}" class="btn btn-primary">edit</a></td>
                <td><a href="{%url 'delete'%}?id={{st.id}}" class="btn btn-danger">delete</a></td>
            </tr>
            {%endfor%}
            </table>
          
        </div>
       </div>
         <h1 align="center"><a href="{%url 'logout'%}">logout</a></h1>
    </div>
</body>
</html>
