<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>
    <div class="contenier">
        <div class="row  mx-auto mt-3 ">
        <div class=" col-5 card p-3">
            <h1>Product Registreation</h1>
            <hr>
            <form action="" method="post" enctype="multipart/form-data">
                <span>{{success}}</span>
                {%csrf_token%}
                <input type="hidden" name="id" value="{{Product_id}}">
                <br>
                <input type="text" name="name" placeholder="Enter Product Name" class="form-control" value="{{p.name}}">
                <br>
                <br>
                <input type="text" name="price" placeholder="Enter Product Price" class="form-control" value="{{p.price}}">
                <br>
                <br>
                <input type="text" name="qty" placeholder="Enter Product qty" class="form-control" value="{{p.qty}}">
                <br>
                <br>
                {%if p%}
                <img src="media/{{p.image}}" alt="" height="50px" width="50px">
                <span>{{p.image}}</span>
                {%endif%}
                <br>
                <input type="file" name="image" class="form-control">
                <br>
                <input type="submit" class="btn btn-success">
                <input type="reset" class="btn btn-primary">
            </form>
        </div>
    </div>
    </div> 
    <div class="col-1" >

    </div>

    <div class="col-6 card p-3" >
        <h1>Product Details</h1>
        <hr>
        <table class="table">
            <tr>
                <th>id</th>
                <th>name</th>
                <th>price</th>
                <th>qty</th>
                <th>image</th>
                <th colspan="2">Action</th>
            </tr>
            {%for p in products%}
            <tr>
                <td>{{forloop.counter}}</td>
                <td>{{p.name}}</td>
                <td>{{p.price}}</td>
                <td>{{p.qty}}</td>
                <td><img src="media/{{p.image}}" alt="{{p.image}}" height="50px" width="50px"></td>
                <td><a href="{%url 'edit'%}?id={{p.id}}" class="btn btn-primary">Edit</a></td>
                <td><a href="{%url 'delete'%}?id={{p.id}}" class="btn btn-danger">Delete</a></td>
            </tr>
            {%endfor%}
        </table>
    </div>
</body>
</html>
